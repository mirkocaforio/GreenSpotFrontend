name: Build and Release Service - Vite + React

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      tags:
        description: 'Forced build'
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build Service
    runs-on: ubuntu-latest
    permissions: write-all
    environment: aws
    env:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PATH: ${{ secrets.SSH_PATH }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      ENV_FILE: ${{ secrets.ENV_FILE }}
      DEPLOY: ${{ vars.DEPLOY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.4.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Start test phase
        run: npm run test --if-present

      - name: Get latest tag
        id: tag_version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 --match "v*" || echo "v0.0.0")
          echo "TAG=$latest_tag" >> $GITHUB_ENV
          echo "REAL_OLD_TAG=$latest_tag" >> $GITHUB_ENV

      - name: Increment version
        id: new_version
        run: |
          latest_tag=${{ env.TAG }}
          major=$(echo "$latest_tag" | cut -d '.' -f1 | tr -d 'v')
          minor=$(echo "$latest_tag" | cut -d '.' -f2)
          patch=$(echo "$latest_tag" | cut -d '.' -f3)
          if (( patch == 9 )); then
              patch=0
              if (( minor == 9 )); then
                minor=0
                major=$((major + 1))
              else
                minor=$((minor + 1))
              fi
          else
              patch=$((patch + 1))
          fi
          new_version="v$major.$minor.$patch"
          echo "NEW_TAG=$new_version" >> $GITHUB_ENV
          echo "NEW_TAG=$new_version" >> $GITHUB_OUTPUT

      - name: Create and push new tag
        uses: tvdias/github-tagger@v0.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ env.NEW_TAG }}

      - name: Update package.json version
        run: |
          new_version=${{ env.NEW_TAG }}
          sed -i "s/\"version\": \".*\"/\"version\": \"$new_version\"/" package.json

      - name: Pull latest changes
        run: |
          git pull origin ${{ github.ref_name }}

      - name: Commit and push changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add package.json
          git commit -m "Update package.json to ${{ env.NEW_TAG }}"
          git push

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          commitMode: true
          configuration: .github/release-changelog-config.json
          fromTag: ${{ env.REAL_OLD_TAG }}
          toTag: ${{ env.NEW_TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Print Changelog
        run: |
          echo "${{ steps.changelog.outputs.changelog }}"

      - name: Save Changelog to File
        run: |
          echo "${{ steps.changelog.outputs.changelog }}" | sed '/- PR: #0/d' > changelog.md
          cat changelog.md
        id: save_changelog

      - name: Creating Release
        uses: ncipollo/release-action@v1.14.0
        with:
          tag: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          bodyFile: changelog.md
          makeLatest: "latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy
        run: |
          if  [ "$DEPLOY" != 1  ]; then
            echo "Skipping deployment due to missing requirements"
            exit 0
          fi

          if [ -z "$SSH_USER" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_PATH" ] || [ -z "$SSH_KEY" ]; then
            echo "Missing required environment variables"
            exit 1
          fi

          echo "Deploying service to server"

          echo "$SSH_KEY" > key.pem
          chmod 600 key.pem

          echo "$ENV_FILE" > .env
          
          ssh -o StrictHostKeyChecking=no -i key.pem $SSH_USER@$SSH_HOST "mkdir -p $SSH_PATH${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}/dist"

          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no" dist/ $SSH_USER@$SSH_HOST:$SSH_PATH${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}/dist/
          rsync -avz -e "ssh -i key.pem -o StrictHostKeyChecking=no" server.js $SSH_USER@$SSH_HOST:$SSH_PATH${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}/server.js
          scp -o StrictHostKeyChecking=no -i key.pem .env $SSH_USER@$SSH_HOST:$SSH_PATH${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}/.env
          scp -o StrictHostKeyChecking=no -i key.pem upservice.sh $SSH_USER@$SSH_HOST:$SSH_PATH${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}/upservice.sh

          ssh -o StrictHostKeyChecking=no -i key.pem $SSH_USER@$SSH_HOST "cd $SSH_PATH${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/} ; sudo chmod +x upservice.sh ; ls ; sudo ./upservice.sh"
